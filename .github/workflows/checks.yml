name: Shared checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Version and lock consistency
        run: |
          uv lock --check
          uv run --locked --no-sync python scripts/version_manager.py check
      - name: Generated rules
        run: |
          uv run --locked --no-sync python scripts/sync_rules.py
          git diff --exit-code -- AGENTS.md CLAUDE.md .github/copilot-instructions.md
      - name: Translation catalogs
        run: |
          uv run --locked --no-sync python scripts/i18n_update.py
          uv run --locked --no-sync python scripts/i18n_audit.py
          uv run --locked --no-sync python scripts/i18n_release.py
          git diff --exit-code -- assets/locales src/fluentytdl/utils/ui_text.py
      - name: Ruff
        run: |
          uv run --locked --no-sync ruff check src tests scripts
          uv run --locked --no-sync ruff format --check src tests scripts
      - name: Pyright (advisory)
        continue-on-error: true
        run: uv run --locked --no-sync pyright src
  unit-linux:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Logic tests
        env:
          FLUENTYTDL_DATA_DIR_OVERRIDE: ${{ runner.temp }}/fluentytdl-tests
        run: uv run --locked --no-sync pytest tests -m "not windows_only and not needs_components and not windows_gui" -n auto --dist loadscope -q --tb=short --junitxml=build/tests-linux.xml
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-linux
          path: build/tests-linux.xml
  test-windows:
    name: Component and Windows tests
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      FLUENTYTDL_REQUIRE_BUILD_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Prepare latest components for integration tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python scripts/fetch_tools.py --destination build/test-components
      - name: Windows-only, component and GUI tests
        env:
          FLUENTYTDL_DATA_DIR_OVERRIDE: ${{ runner.temp }}/fluentytdl-tests
          FLUENTYTDL_TEST_YTDLP: ${{ github.workspace }}/build/test-components/bin/yt-dlp/yt-dlp.exe
          FLUENTYTDL_TEST_COMPONENTS: ${{ github.workspace }}/build/test-components
          FLUENTYTDL_7ZIP_DIR: ${{ github.workspace }}/build/test-components/7zip
        run: uv run --locked --no-sync pytest tests -m "windows_only or needs_components or windows_gui" -q --tb=short --junitxml=build/tests-windows.xml
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-windows
          path: |
            build/tests-windows.xml
            build/test-components/snapshot.json
