name: Set up locked build environment
description: Read the shared toolchain contract and install locked build dependencies
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: python scripts/build_environment.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ steps.versions.outputs.python }}
    - shell: bash
      env:
        UV_VERSION: ${{ steps.versions.outputs.uv }}
      run: |
        python -m pip install "uv==$UV_VERSION"
        uv sync --locked --extra dev --extra build
        uv run --locked --no-sync python scripts/build_environment.py --check
