name: Build and Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Bare version override (non-publishing builds only)
        default: ''
        type: string
      targets:
        description: Artifact target
        default: all
        type: choice
        options: [all, 7z, app-core, setup, full]
      publish:
        description: Publish an existing validated tag
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-release:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      IN_VERSION: ${{ inputs.version }}
      IN_TARGET: ${{ inputs.targets || 'all' }}
      IN_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Resolve release policy
        id: policy
        run: uv run --locked --no-sync python scripts/release_pipeline.py resolve
      - name: Read toolchain
        id: versions
        run: python scripts/build_environment.py
      - name: Install Inno Setup
        if: steps.policy.outputs.target == 'all' || steps.policy.outputs.target == 'setup'
        env:
          INNO_VERSION: ${{ steps.versions.outputs.inno }}
        run: |
          choco install innosetup --version=$env:INNO_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build with all latest components and verify artifacts
        env:
          BUILD_VERSION: ${{ steps.policy.outputs.version }}
          BUILD_TARGET: ${{ steps.policy.outputs.target }}
        run: uv run --locked --no-sync python scripts/build.py --target $env:BUILD_TARGET --version $env:BUILD_VERSION
      - name: Installer lifecycle verification (isolated runner)
        if: steps.policy.outputs.target == 'all' || steps.policy.outputs.target == 'setup'
        run: uv run --locked --no-sync python scripts/test_installer.py --allow-isolated-runner
      - name: Stage verified artifacts
        id: stage
        env:
          BUILD_VERSION: ${{ steps.policy.outputs.version }}
          BUILD_TARGET: ${{ steps.policy.outputs.target }}
        run: uv run --locked --no-sync python scripts/release_pipeline.py stage
      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FluentYTDL-${{ steps.policy.outputs.tag }}-builds
          path: ${{ steps.stage.outputs.artifacts }}/*
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-verification-reports
          path: |
            build/runs/*/build-result.json
            build/runs/*/self-test.json
            build/runs/*/archive-reports/*.json
            build/runs/*/components/snapshot.json
            build/installer-tests/**
          if-no-files-found: ignore
      - name: Publish verified draft and check public downloads
        if: steps.policy.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync python scripts/release_pipeline.py publish
      - name: Report failed publication or verification
        if: failure()
        run: |
          '::error::Build/release verification failed. Check reports; an existing public release was not removed.' | Write-Output
          'Release pipeline failed; inspect the failed step and uploaded verification reports.' >> $env:GITHUB_STEP_SUMMARY
