name: Refresh Cloudflare update metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: control-center-metadata
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Refresh metadata with a short-lived read-only job token
        env:
          CONTROL_CENTER_SYNC_TOKEN: ${{ secrets.FLUENTYTDL_CONTROL_CENTER_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'requests>=2.32,<3'
          python scripts/sync_control_center.py
