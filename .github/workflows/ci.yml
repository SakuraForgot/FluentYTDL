name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    name: Frozen application
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Compile and verify frozen application
        run: uv run --locked --no-sync python scripts/build.py --target spec
      - name: Source must remain unchanged
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source files' }
      - name: Build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-reports
          path: |
            build/runs/*/build-result.json
            build/runs/*/self-test.json
  required:
    name: Required checks
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
        run: test "$CHECKS" = success && test "$BUILD" = success
